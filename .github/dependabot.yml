version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # @cloudflare/vitest-pool-workers requires Vitest ^4.1.0.
      - dependency-name: vitest
        versions:
          - ">=5.0.0 <6.0.0"
    groups:
      npm-development:
        dependency-type: development
        patterns:
          - "*"
      npm-production:
        dependency-type: production
        patterns:
          - "*"
